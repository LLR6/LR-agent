<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LR-Agent</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071018;
      --panel: rgba(12, 25, 36, .88);
      --line: rgba(125, 211, 252, .16);
      --text: #e6f3ff;
      --muted: #8ba4b8;
      --accent: #58d8ff;
      --accent2: #8b5cf6;
      --ok: #4ade80;
      --bad: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(88,216,255,.13), transparent 28%),
        radial-gradient(circle at 80% 0%, rgba(139,92,246,.12), transparent 30%),
        var(--bg);
      color: var(--text);
    }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 260px 1fr 360px;
    }
    aside, .trace {
      background: rgba(5, 14, 22, .72);
      backdrop-filter: blur(18px);
    }
    aside { border-right: 1px solid var(--line); padding: 22px 16px; }
    .trace { border-left: 1px solid var(--line); padding: 22px 16px; overflow: auto; }
    .brand {
      font-weight: 800;
      font-size: 20px;
      letter-spacing: .4px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
    }
    .orb {
      width: 28px; height: 28px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 28px rgba(88,216,255,.28);
    }
    button, select, textarea {
      font: inherit;
      color: inherit;
    }
    button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.035);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
    }
    button:hover { border-color: rgba(88,216,255,.5); }
    .primary {
      background: linear-gradient(135deg, rgba(88,216,255,.2), rgba(139,92,246,.22));
      border-color: rgba(88,216,255,.36);
    }
    .new { width: 100%; margin-bottom: 18px; }
    .session, .run-item {
      width: 100%;
      text-align: left;
      margin: 5px 0;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .side-title {
      margin: 22px 4px 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
    }
    main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(7,16,24,.62);
      backdrop-filter: blur(14px);
    }
    .meta { color: var(--muted); font-size: 13px; }
    select {
      border: 1px solid var(--line);
      background: #0b1722;
      border-radius: 9px;
      padding: 8px 10px;
    }
    #messages {
      overflow: auto;
      padding: 26px max(24px, 8vw);
    }
    .msg {
      max-width: 900px;
      margin: 0 auto 18px;
      padding: 16px 18px;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.65;
      border: 1px solid var(--line);
    }
    .user {
      background: rgba(88,216,255,.06);
    }
    .assistant {
      background: rgba(255,255,255,.025);
    }
    .composer {
      padding: 18px max(24px, 8vw) 24px;
      border-top: 1px solid var(--line);
      background: rgba(7,16,24,.74);
    }
    .compose-box {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }
    textarea {
      resize: vertical;
      min-height: 58px;
      max-height: 220px;
      border: 1px solid var(--line);
      outline: none;
      background: rgba(255,255,255,.035);
      border-radius: 12px;
      padding: 13px 14px;
    }
    textarea:focus { border-color: rgba(88,216,255,.55); }
    .send { height: 58px; min-width: 86px; }
    .trace h3 { margin: 0 0 14px; font-size: 14px; color: var(--muted); font-weight: 600; }
    .trace h3.section { margin-top: 22px; }
    .plan-card, .review-card {
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 11px;
      background: rgba(255,255,255,.025);
      font-size: 12px;
      color: var(--muted);
    }
    .plan-card ol, .review-card ul { padding-left: 18px; margin: 8px 0 0; }
    .plan-card li, .review-card li { margin: 6px 0; }
    .step {
      margin-bottom: 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 11px;
      background: rgba(255,255,255,.025);
      font-size: 12px;
    }
    .step .name { font-weight: 700; margin-bottom: 6px; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .preview {
      color: var(--muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 170px;
      overflow: auto;
    }
    .empty {
      color: var(--muted);
      text-align: center;
      margin-top: 24vh;
      line-height: 1.8;
    }
    .status-dot {
      display:inline-block; width:8px; height:8px; border-radius:50%;
      background: var(--muted); margin-right:6px;
    }
    @media (max-width: 1100px) {
      .shell { grid-template-columns: 210px 1fr; }
      .trace { display: none; }
    }
    @media (max-width: 720px) {
      .shell { display: block; }
      aside { display: none; }
      main { height: 100vh; }
      header { padding: 14px 16px; }
      #messages { padding: 18px 14px; }
      .composer { padding: 12px 14px 16px; }
    }
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="orb"></div> LR-Agent</div>
    <button class="new primary" id="newSession">＋ 新会话</button>
    <div class="side-title">SESSIONS</div>
    <div id="sessions"></div>
    <div class="side-title">RECENT RUNS</div>
    <div id="runs"></div>
  </aside>

  <main>
    <header>
      <div>
        <div style="font-weight:700">Local Agent Console</div>
        <div class="meta" id="health"><span class="status-dot"></span>checking...</div>
      </div>
      <select id="mode">
        <option value="general">General</option>
        <option value="coder">Coder</option>
        <option value="research">Research</option>
      </select>
    </header>

    <section id="messages">
      <div class="empty" id="empty">
        <b>LR-Agent 已就绪</b><br/>
        输入任务后，Agent 会按需调用文件、命令和 HTTP 工具。<br/>
        工具执行结果会显示在右侧。
      </div>
    </section>

    <div class="composer">
      <div class="compose-box">
        <textarea id="input" placeholder="例如：检查 workspace 里的 Python 项目，修复测试失败并告诉我改了什么。"></textarea>
        <button class="send primary" id="send">执行</button>
      </div>
    </div>
  </main>

  <section class="trace">
    <h3>RUN</h3>
    <div id="runmeta"><div class="meta">尚未开始任务。</div></div>
    <h3 class="section">PLAN</h3>
    <div id="plan"><div class="meta">Coder / Research 模式会先生成可验证计划。</div></div>
    <h3 class="section">EXECUTION TRACE</h3>
    <div id="steps"><div class="meta">还没有工具调用。</div></div>
    <h3 class="section">REVIEW</h3>
    <div id="review"><div class="meta">执行完成后进行结果审查。</div></div>
  </section>
</div>

<script>
  let sessionId = null;
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const messages = document.getElementById("messages");
  const steps = document.getElementById("steps");
  const runMeta = document.getElementById("runmeta");
  const planBox = document.getElementById("plan");
  const reviewBox = document.getElementById("review");
  const mode = document.getElementById("mode");

  function esc(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function addMessage(role, text) {
    const placeholder = document.querySelector("#messages .empty");
    if (placeholder) placeholder.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = esc(text);
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function renderSteps(items) {
    if (!items || !items.length) {
      steps.innerHTML = '<div class="meta">本轮没有工具调用。</div>';
      return;
    }
    steps.innerHTML = items.map(s => `
      <div class="step">
        <div class="name ${s.ok ? "ok" : "bad"}">
          #${s.index} ${esc(s.tool)} · ${s.ok ? "OK" : "FAIL"}
        </div>
        <div class="preview">${esc(JSON.stringify(s.arguments, null, 2))}</div>
        <div class="preview" style="margin-top:7px">${esc(s.preview)}</div>
      </div>
    `).join("");
  }

  function renderPlan(plan) {
    if (!plan) {
      planBox.innerHTML = '<div class="meta">当前模式未启用规划。</div>';
      return;
    }
    const items = (plan.steps || []).map(item =>
      '<li><b>' + esc(item.action) + '</b><br><span>' + esc(item.success_condition || "") + '</span></li>'
    ).join("");
    planBox.innerHTML =
      '<div class="plan-card"><b>' + esc(plan.goal) + '</b><ol>' + items + '</ol></div>';
  }

  function renderReview(review) {
    if (!review) {
      reviewBox.innerHTML = '<div class="meta">没有审查结果。</div>';
      return;
    }
    const problems = (review.problems || []).map(x => '<li>' + esc(x) + '</li>').join("");
    const next = (review.next_actions || []).map(x => '<li>' + esc(x) + '</li>').join("");
    reviewBox.innerHTML =
      '<div class="review-card"><b class="' + (review.passed ? 'ok' : 'bad') + '">' +
      (review.passed ? 'PASS' : 'NEEDS WORK') + '</b><div style="margin-top:7px">' +
      esc(review.summary || "") + '</div>' +
      (problems ? '<div style="margin-top:8px">Problems<ul>' + problems + '</ul></div>' : '') +
      (next ? '<div style="margin-top:8px">Next<ul>' + next + '</ul></div>' : '') +
      '</div>';
  }

  async function refreshRuns() {
    try {
      const r = await fetch("/api/runs?limit=15");
      if (!r.ok) return;
      const data = await r.json();
      const holder = document.getElementById("runs");
      holder.innerHTML = data.map(item =>
        '<button class="run-item" data-id="' + esc(item.id) + '" title="' +
        esc(item.task) + '">[' + esc(item.status) + '] ' + esc(item.task) + '</button>'
      ).join("");
      holder.querySelectorAll(".run-item").forEach(btn => {
        btn.addEventListener("click", () => loadRun(btn.dataset.id));
      });
    } catch (_) {}
  }

  async function loadRun(id) {
    try {
      const r = await fetch("/api/runs/" + encodeURIComponent(id));
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || "Failed to load run");
      runMeta.innerHTML =
        '<div class="plan-card"><b>' + esc(data.status || "unknown") +
        '</b><div style="margin-top:6px">' + esc(data.id || "") + '</div>' +
        '<button id="resumeLoadedRun" style="margin-top:10px;width:100%">继续此任务</button></div>';
      renderPlan(data.plan);
      renderSteps(data.steps || []);
      renderReview(data.review);
      const button = document.getElementById("resumeLoadedRun");
      if (button) button.addEventListener("click", () => resumeRun(data.id));
    } catch (e) {
      runMeta.innerHTML = '<div class="bad">加载 run 失败：' + esc(e.message) + '</div>';
    }
  }

  async function resumeRun(id) {
    if (send.disabled) return;
    send.disabled = true;
    send.textContent = "恢复中";
    runMeta.innerHTML = '<div class="meta">正在根据持久化证据恢复任务...</div>';
    try {
      const r = await fetch("/api/runs/" + encodeURIComponent(id) + "/resume", {
        method: "POST"
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || "Resume failed");
      sessionId = data.session_id;
      addMessage("assistant", "已恢复上一轮任务。\n\n" + data.answer);
      runMeta.innerHTML =
        '<div class="plan-card"><b>' + esc(data.status || "unknown") +
        '</b><div style="margin-top:6px">' + esc(data.run_id || "") + '</div></div>';
      renderPlan(data.plan);
      renderSteps(data.steps);
      renderReview(data.review);
      refreshSessions();
      refreshRuns();
      refreshRuns();
    } catch (e) {
      runMeta.innerHTML = '<div class="bad">恢复失败：' + esc(e.message) + '</div>';
    } finally {
      send.disabled = false;
      send.textContent = "执行";
    }
  }

  async function refreshSessions() {
    try {
      const r = await fetch("/api/sessions");
      if (!r.ok) return;
      const data = await r.json();
      const holder = document.getElementById("sessions");
      holder.innerHTML = data.map(s =>
        `<button class="session" data-id="${esc(s.id)}" title="${esc(s.title)}">${esc(s.title)}</button>`
      ).join("");
      holder.querySelectorAll(".session").forEach(btn => {
        btn.addEventListener("click", () => loadSession(btn.dataset.id));
      });
    } catch (_) {}
  }

  async function loadSession(id) {
    try {
      const r = await fetch("/api/sessions/" + encodeURIComponent(id) + "/messages");
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || "Failed to load session");
      sessionId = id;
      messages.innerHTML = "";
      data.forEach(item => addMessage(item.role === "user" ? "user" : "assistant", item.content));
      steps.innerHTML = '<div class="meta">历史会话已加载；执行轨迹只显示当前新一轮。</div>';
      runMeta.innerHTML = '<div class="meta">发起下一轮任务后显示新的 run id。</div>';
      planBox.innerHTML = '<div class="meta">历史消息已加载；计划不单独持久化显示。</div>';
      reviewBox.innerHTML = '<div class="meta">发起下一轮任务后显示新的审查结果。</div>';
      input.focus();
    } catch (e) {
      steps.innerHTML = '<div class="bad">加载会话失败：' + esc(e.message) + '</div>';
    }
  }

  async function health() {
    const el = document.getElementById("health");
    try {
      const r = await fetch("/api/health");
      const data = await r.json();
      el.innerHTML = '<span class="status-dot" style="background:var(--ok)"></span>' +
        esc(data.model) + " · " + esc(data.workspace);
    } catch (_) {
      el.innerHTML = '<span class="status-dot" style="background:var(--bad)"></span>offline';
    }
  }

  async function execute() {
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    addMessage("user", text);
    send.disabled = true;
    send.textContent = "执行中";
    steps.innerHTML = '<div class="meta">Agent 正在执行工具...</div>';
    runMeta.innerHTML = '<div class="meta">正在创建持久化运行记录...</div>';
    planBox.innerHTML = '<div class="meta">正在生成计划...</div>';
    reviewBox.innerHTML = '<div class="meta">等待执行结果...</div>';

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          message: text,
          session_id: sessionId,
          mode: mode.value
        })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || "Request failed");
      sessionId = data.session_id;
      addMessage("assistant", data.answer);
      runMeta.innerHTML =
        '<div class="plan-card"><b>' + esc(data.status || "unknown") +
        '</b><div style="margin-top:6px">' + esc(data.run_id || "") + '</div></div>';
      renderPlan(data.plan);
      renderSteps(data.steps);
      renderReview(data.review);
      refreshSessions();
    } catch (e) {
      addMessage("assistant", "执行失败： " + e.message);
      steps.innerHTML = '<div class="bad">请求失败，请检查终端日志和 .env 配置。</div>';
    } finally {
      send.disabled = false;
      send.textContent = "执行";
      input.focus();
    }
  }

  send.addEventListener("click", execute);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      execute();
    }
  });
  document.getElementById("newSession").addEventListener("click", () => {
    sessionId = null;
    messages.innerHTML = '<div class="empty" id="empty">新会话已开始。</div>';
    steps.innerHTML = '<div class="meta">还没有工具调用。</div>';
    runMeta.innerHTML = '<div class="meta">尚未开始任务。</div>';
    planBox.innerHTML = '<div class="meta">Coder / Research 模式会先生成可验证计划。</div>';
    reviewBox.innerHTML = '<div class="meta">执行完成后进行结果审查。</div>';
  });

  health();
  refreshSessions();
  refreshRuns();
  input.focus();
</script>
</body>
</html>
