name: Build promo video

on:
  push:
    branches:
      - main
    paths:
      - "docs/media/chronoforge-showcase.gif"
      - ".github/workflows/build-promo-video.yml"
      - "README.md"
      - "README_EN.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert GIF to MP4
        run: >
          ffmpeg -y
          -i docs/media/chronoforge-showcase.gif
          -movflags faststart
          -pix_fmt yuv420p
          -vf "fps=30,scale=1200:674:flags=lanczos"
          docs/media/chronoforge-showcase.mp4

      - name: Commit MP4
        run: |
          if git diff --quiet -- docs/media/chronoforge-showcase.mp4 && git ls-files --error-unmatch docs/media/chronoforge-showcase.mp4 >/dev/null 2>&1; then
            echo "MP4 already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/chronoforge-showcase.mp4
          git commit -m "docs: render ChronoForge promo MP4"
          git push

      - name: Upload video to v1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.1.0 docs/media/chronoforge-showcase.mp4 --clobber
