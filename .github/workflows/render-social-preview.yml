name: Render social preview

on:
  push:
    branches:
      - main
    paths:
      - "docs/media/lr-agent-social-preview.svg"
      - ".github/workflows/render-social-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Render PNG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="docs/media/lr-agent-social-preview.svg",
              write_to="docs/media/lr-agent-social-preview.png",
              output_width=1200,
              output_height=630,
          )
          PY

      - name: Commit rendered preview
        run: |
          if git diff --quiet -- docs/media/lr-agent-social-preview.png &&              git ls-files --error-unmatch docs/media/lr-agent-social-preview.png >/dev/null 2>&1; then
            echo "Social preview is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/lr-agent-social-preview.png
          git commit -m "docs: render social preview PNG"
          git push
