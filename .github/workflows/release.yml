name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag
          actual = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if actual != expected:
              raise SystemExit(f"tag {tag} does not match pyproject version {actual}")
          print(f"version OK: {actual}")
          PY

      - name: Check release metadata consistency
        run: python scripts/check_release_metadata.py

      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "twine>=5"
          python -m build
          python -m twine check dist/*

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/release-wheel-smoke
          /tmp/release-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/release-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/release-wheel-smoke/bin/lr-agent --version

      - name: Generate checksums and release provenance
        shell: bash
        run: |
          sha256sum dist/* > SHA256SUMS.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          artifacts = []
          for path in sorted(Path("dist").iterdir()):
              if path.is_file():
                  artifacts.append({
                      "name": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
          Path("release-metadata.json").write_text(
              json.dumps({
                  "schema": "lr-release-provenance/v1",
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "version": version,
                  "tag": os.environ["GITHUB_REF_NAME"],
                  "commit": os.environ["GITHUB_SHA"],
                  "artifacts": artifacts,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            SHA256SUMS.txt \
            release-metadata.json \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
