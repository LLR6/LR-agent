name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check release metadata consistency
        run: python scripts/check_release_metadata.py
      - name: Compile Python
        run: python -m compileall -q lr_agent
      - name: Build wheel
        run: |
          python -m pip install "build>=1.2"
          python -m build --wheel
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/lr-wheel-smoke
          /tmp/lr-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/lr-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/lr-wheel-smoke/bin/lr-agent --version
      - uses: actions/upload-artifact@v4
        with:
          name: LR-agent-wheel-${{ matrix.python-version || 'py' }}
          path: dist/*.whl
      - name: Test
        run: pytest
      - name: Coverage snapshot
        run: |
          python -m pip install "coverage>=7.6"
          coverage run -m pytest
          coverage report -m
          coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: LR-agent-coverage-${{ matrix.python-version || 'py' }}
          path: coverage.xml
      - name: Validate research manifest example
        run: python scripts/validate_research_manifest.py docs/research/experiment-manifest.example.json
      - name: Validate research JSON schemas
        run: |
          python scripts/validate_json_schema.py schemas/research-manifest.schema.json docs/research/experiment-manifest.example.json
      - name: Fingerprint research manifest example
        run: python scripts/fingerprint_experiment.py docs/research/experiment-manifest.example.json --artifact docs/research/CLAIM_LEDGER.md --output /tmp/research-artifacts.json
      - name: Validate artifact bundle schema
        run: python scripts/validate_json_schema.py schemas/artifact-bundle.schema.json /tmp/research-artifacts.json
      - name: Check Web UI JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("lr_agent/web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          if not scripts:
              raise SystemExit("No inline script found in Web UI")
          Path("/tmp/lr-agent-ui.js").write_text(
              "\n".join(scripts),
              encoding="utf-8",
          )
          PY
          node --check /tmp/lr-agent-ui.js
