name: Bug report
description: Report a reproducible LR-Agent runtime or UI bug
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make LR-Agent more reliable. Please remove secrets and private repository data.
  - type: input
    id: version
    attributes:
      label: LR-Agent version / commit
      placeholder: "v1.1.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core Agent
        - Counterfactual Forge
        - Causal Genome
        - ChronoForge
        - Invariant DNA
        - Web UI
        - CLI
        - GitHub integration
        - RAG / embeddings
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands, sample files, and exact steps needed to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API keys, tokens, private paths and sensitive data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets and private data.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
