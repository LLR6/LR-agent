name: Research counterexample
description: Share a case where a Gene, Forge result, Tripwire, or Patch Life Report is misleading
title: "[Counterexample] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Counterexamples are first-class research data. A result that breaks an LR-Agent hypothesis is useful.
  - type: dropdown
    id: mechanism
    attributes:
      label: Mechanism
      options:
        - Causal Genome
        - Anti-Gene
        - Genealogy / contamination
        - Proof-Carrying Gene
        - Invariant DNA
        - Epistemic Tripwire
        - Counterfactual Forge
        - ChronoForge
        - Reality calibration
        - Other
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What behavior or hypothesis does this challenge?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Reproducible setup
      description: Repository snapshot/demo, model configuration, commands, and relevant settings.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Observed evidence
      description: Include test output, run IDs, survival report values, or minimal traces.
    validations:
      required: true
  - type: textarea
    id: interpretation
    attributes:
      label: Your interpretation
      description: Why do you think the mechanism failed or the result is misleading?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The report contains no secrets or private repository data.
          required: true
