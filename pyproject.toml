[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-agent"
version = "1.1.0"
description = "Research coding agent with Counterfactual Forge, Causal Genome and ChronoForge for falsifiable strategy learning and prospective patch aging."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LLR6"}]
keywords = [
  "coding-agent",
  "llm-agent",
  "agentic-ai",
  "software-engineering",
  "chronoforge",
  "self-evolving-agents"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Software Development :: Testing"
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1"
]

[project.scripts]
lr-agent = "lr_agent.__main__:main"

[project.urls]
Homepage = "https://github.com/LLR6/LR-agent"
Repository = "https://github.com/LLR6/LR-agent"
Documentation = "https://github.com/LLR6/LR-agent/tree/main/docs"
Issues = "https://github.com/LLR6/LR-agent/issues"

[tool.setuptools.packages.find]
include = ["lr_agent*"]

[tool.setuptools.package-data]
lr_agent = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
